services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RmMcp@Test2026!"
    ports:
      - "1433:1433"
    volumes:
      - ./init-corpore.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-entrypoint.sh:/init-entrypoint.sh
    entrypoint: /bin/bash /init-entrypoint.sh
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "RmMcp@Test2026!" -C -Q "SELECT 1 FROM Corpore.dbo.GCOLIGADA" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15

  mock-soap:
    build: ./mock-soap
    ports:
      - "8051:8051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,base64; r=urllib.request.Request('http://localhost:8051/wsDataServer/IwsDataServer'); r.add_header('Authorization','Basic '+base64.b64encode(b'mestre:totvs').decode()); urllib.request.urlopen(r)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # persontup/mcp-totvs-rm — real RM MCP bridge (Python FastAPI).
  # Patched conecta.py uses RM_HOST; Swagger specs mounted from extraction.
  # Validates: real MCP bridge → REST client → mock RM (Swagger-spec responses).
  rm-bridge:
    image: persontup/mcp-totvs-rm:1.0
    environment:
      RM_HOST: "http://mock-soap:8051"
      RM_USER: "mestre"
      RM_PASS: "totvs"
    ports:
      - "8000:8000"
    volumes:
      - ./bridge-patches/conecta.py:/app/conecta/conecta.py
      - ./swagger-docs:/app/app/swagger_docs
    depends_on:
      mock-soap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
